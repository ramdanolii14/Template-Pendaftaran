<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Form Masuk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: {
                            900: '#121212',
                            800: '#1e1e1e',
                            850: '#181818'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-900 text-gray-200 flex h-screen font-sans antialiased overflow-hidden">
    <aside class="w-64 bg-gray-850 border-r border-gray-800 flex flex-col shrink-0">
        <div class="h-16 flex items-center px-6 border-b border-gray-800">
            <h1 class="text-lg font-bold text-white tracking-wider">ADMIN<span class="text-blue-500">PANEL</span></h1>
        </div>
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <a href="#" class="block px-4 py-2.5 rounded-xl text-gray-400 hover:bg-gray-800 hover:text-gray-200 transition-colors">Dashboard</a>
            <a href="#" class="block px-4 py-2.5 rounded-xl text-gray-400 hover:bg-gray-800 hover:text-gray-200 transition-colors">Data User</a>
            <a href="#" class="block px-4 py-2.5 rounded-xl bg-blue-600/10 text-blue-400 font-medium transition-colors">Form Masuk</a>
            <a href="#" class="block px-4 py-2.5 rounded-xl text-gray-400 hover:bg-gray-800 hover:text-gray-200 transition-colors">Pengaturan</a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="h-16 bg-gray-850/50 border-b border-gray-800 flex items-center justify-between px-8 backdrop-blur-sm z-10 shrink-0">
            <h2 class="text-lg font-medium text-gray-100">Review Form Masuk</h2>
            <div class="flex items-center gap-3">
                <span class="text-sm text-gray-400">Admin</span>
                <div class="w-8 h-8 rounded-full bg-gray-700 border border-gray-600"></div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-8 space-y-6">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex gap-2 w-full md:w-auto">
                    <button class="px-4 py-2 text-sm font-medium rounded-lg bg-blue-600 text-white transition-all">Semua</button>
                    <button class="px-4 py-2 text-sm font-medium rounded-lg bg-gray-800 text-gray-400 hover:text-gray-200 transition-all border border-gray-700">Menunggu Review <span class="ml-1 bg-yellow-500/20 text-yellow-500 px-1.5 py-0.5 rounded text-xs">12</span></button>
                    <button class="px-4 py-2 text-sm font-medium rounded-lg bg-gray-800 text-gray-400 hover:text-gray-200 transition-all border border-gray-700">Selesai</button>
                </div>
                <div class="relative w-full md:w-64">
                    <input type="text" placeholder="Cari User ID..." class="w-full bg-gray-800 border border-gray-700 rounded-lg pl-10 pr-4 py-2 text-sm text-gray-100 focus:outline-none focus:border-blue-500 transition-all">
                    <svg class="w-4 h-4 text-gray-500 absolute left-3.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
            </div>

            <div class="bg-gray-800 rounded-2xl border border-gray-800/50 shadow-sm overflow-hidden flex flex-col">
                <div class="overflow-x-auto flex-1">
                    <table class="w-full text-left text-sm text-gray-400">
                        <thead class="bg-gray-900/50 text-gray-500 text-xs uppercase tracking-wider border-b border-gray-800/50">
                            <tr>
                                <th class="px-6 py-4 font-medium">User ID</th>
                                <th class="px-6 py-4 font-medium">Waktu Submit</th>
                                <th class="px-6 py-4 font-medium">Progress Dokumen</th>
                                <th class="px-6 py-4 font-medium">Status Review</th>
                                <th class="px-6 py-4 font-medium text-right">Aksi</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-800/50">
                            <tr class="hover:bg-gray-700/10 transition-colors group">
                                <td class="px-6 py-4 text-gray-200 font-medium">#1029</td>
                                <td class="px-6 py-4 text-gray-400">10 Menit lalu</td>
                                <td class="px-6 py-4">
                                    <div class="flex items-center gap-2">
                                        <div class="w-24 bg-gray-900 rounded-full h-1.5">
                                            <div class="bg-blue-500 h-1.5 rounded-full" style="width: 100%"></div>
                                        </div>
                                        <span class="text-xs text-gray-500">2/2 File</span>
                                    </div>
                                </td>
                                <td class="px-6 py-4"><span class="px-2.5 py-1 rounded-md bg-yellow-900/30 text-yellow-400 text-[10px] font-bold uppercase tracking-wider border border-yellow-900/50">Menunggu</span></td>
                                <td class="px-6 py-4 text-right space-x-2">
                                    <button class="px-3 py-1.5 bg-blue-600/20 text-blue-400 hover:bg-blue-600 hover:text-white rounded-lg text-xs font-medium transition-all">Review Form</button>
                                </td>
                            </tr>
                            <tr class="hover:bg-gray-700/10 transition-colors group">
                                <td class="px-6 py-4 text-gray-200 font-medium">#1028</td>
                                <td class="px-6 py-4 text-gray-400">1 Jam lalu</td>
                                <td class="px-6 py-4">
                                    <div class="flex items-center gap-2">
                                        <div class="w-24 bg-gray-900 rounded-full h-1.5">
                                            <div class="bg-blue-500 h-1.5 rounded-full" style="width: 100%"></div>
                                        </div>
                                        <span class="text-xs text-gray-500">2/2 File</span>
                                    </div>
                                </td>
                                <td class="px-6 py-4"><span class="px-2.5 py-1 rounded-md bg-green-900/30 text-green-400 text-[10px] font-bold uppercase tracking-wider border border-green-900/50">Diterima</span></td>
                                <td class="px-6 py-4 text-right space-x-2">
                                    <button class="px-3 py-1.5 bg-gray-700/50 text-gray-300 hover:bg-gray-700 rounded-lg text-xs font-medium transition-all">Lihat Detail</button>
                                </td>
                            </tr>
                            <tr class="hover:bg-gray-700/10 transition-colors group">
                                <td class="px-6 py-4 text-gray-200 font-medium">#1025</td>
                                <td class="px-6 py-4 text-gray-400">Kemarin, 14:30</td>
                                <td class="px-6 py-4">
                                    <div class="flex items-center gap-2">
                                        <div class="w-24 bg-gray-900 rounded-full h-1.5">
                                            <div class="bg-red-500 h-1.5 rounded-full" style="width: 50%"></div>
                                        </div>
                                        <span class="text-xs text-gray-500">1/2 File</span>
                                    </div>
                                </td>
                                <td class="px-6 py-4"><span class="px-2.5 py-1 rounded-md bg-red-900/30 text-red-400 text-[10px] font-bold uppercase tracking-wider border border-red-900/50">Ditolak (Revisi)</span></td>
                                <td class="px-6 py-4 text-right space-x-2">
                                    <button class="px-3 py-1.5 bg-gray-700/50 text-gray-300 hover:bg-gray-700 rounded-lg text-xs font-medium transition-all">Lihat Detail</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <div class="px-6 py-4 border-t border-gray-800/50 flex items-center justify-between">
                    <span class="text-xs text-gray-500">Menampilkan 3 form terbaru</span>
                    <div class="flex gap-1">
                        <button class="px-3 py-1.5 text-xs font-medium text-gray-400 bg-gray-900 border border-gray-700 rounded-md hover:bg-gray-800 disabled:opacity-50" disabled>Sebelumnya</button>
                        <button class="px-3 py-1.5 text-xs font-medium text-white bg-blue-600 rounded-md">1</button>
                        <button class="px-3 py-1.5 text-xs font-medium text-gray-400 bg-gray-900 border border-gray-700 rounded-md hover:bg-gray-800 disabled:opacity-50" disabled>Selanjutnya</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
