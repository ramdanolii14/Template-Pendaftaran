<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - GUI Config v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: {
                            900: '#121212',
                            800: '#1e1e1e',
                            850: '#181818'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-900 text-gray-200 flex h-screen font-sans antialiased overflow-hidden">
    <aside class="w-64 bg-gray-850 border-r border-gray-800 flex flex-col shrink-0">
        <div class="h-16 flex items-center px-6 border-b border-gray-800">
            <h1 class="text-lg font-bold text-white tracking-wider">ADMIN<span class="text-blue-500">PANEL</span></h1>
        </div>
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <a href="#" class="block px-4 py-2.5 rounded-xl text-gray-400 hover:bg-gray-800 hover:text-gray-200 transition-colors">Dashboard</a>
            <a href="#" class="block px-4 py-2.5 rounded-xl text-gray-400 hover:bg-gray-800 hover:text-gray-200 transition-colors">Data User</a>
            <a href="#" class="block px-4 py-2.5 rounded-xl bg-blue-600/10 text-blue-400 font-medium transition-colors">Pengaturan</a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="h-16 bg-gray-850/50 border-b border-gray-800 flex items-center justify-between px-8 backdrop-blur-sm z-10 shrink-0">
            <h2 class="text-lg font-medium text-gray-100">Pengaturan Sistem</h2>
        </header>

        <div class="flex-1 overflow-y-auto p-8 space-y-8 relative">
            <div class="bg-gray-800 rounded-2xl border border-gray-800/50 shadow-sm p-6">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h3 class="text-lg font-medium text-white">Dokumen Permintaan (GUI)</h3>
                        <p class="text-sm text-gray-400">Atur form upload yang akan diisi oleh user.</p>
                    </div>
                    <button id="addDocBtn" type="button" class="py-2 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-blue-400 bg-blue-900/30 hover:bg-blue-900/50 transition-all">
                        + Tambah Dokumen
                    </button>
                </div>

                <div id="docList" class="space-y-4 max-w-5xl pb-32">
                    </div>

                <div class="fixed bottom-0 right-0 left-64 bg-gray-850/90 backdrop-blur border-t border-gray-800 p-6 flex justify-end z-20">
                    <button type="button" onclick="alert('ok')" class="py-2.5 px-6 rounded-xl text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 transition-all">
                        Simpan Semua Pengaturan
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ide jelek tapi yaudah
        const docList = document.getElementById('docList');
        const addDocBtn = document.getElementById('addDocBtn');
        let docCounter = 0;

        const mimeTypes = [
            { id: 'pdf', label: '.pdf (application/pdf)' },
            { id: 'jpg', label: '.jpg (image/jpeg)' },
            { id: 'png', label: '.png (image/png)' },
            { id: 'gif', label: '.gif (image/gif)' },
            { id: 'svg', label: '.svg (image/svg+xml)' },
            { id: 'webp', label: '.webp (image/webp)' },
            { id: 'doc', label: '.doc (MS Word)' },
            { id: 'docx', label: '.docx (MS Word)' },
            { id: 'xls', label: '.xls (MS Excel)' },
            { id: 'xlsx', label: '.xlsx (MS Excel)' },
            { id: 'txt', label: '.txt (text/plain)' },
            { id: 'csv', label: '.csv (text/csv)' },
            { id: 'zip', label: '.zip (Archive)' },
            { id: 'rar', label: '.rar (Archive)' }
        ];

        const defaultDocs = [
            { label: "Scan KTP / Paspor", desc: "Pastikan foto jelas dan tidak buram. Format KTP harus asli.", types: ['pdf', 'jpg', 'png'], maxKb: 2048, req: true },
            { label: "Curriculum Vitae", desc: "Upload CV terbaru format ATS friendly lebih disarankan.", types: ['pdf'], maxKb: 5120, req: true }
        ];

        // logic
        function createDocItem(data = { label: '', desc: '', types: [], maxKb: 2048, req: false }) {
            docCounter++;
            
            const mimeOptionsHtml = mimeTypes.map(m => `
                <label class="flex items-center gap-2 px-3 py-2 hover:bg-gray-700 cursor-pointer mime-item transition-colors" data-search="${m.label.toLowerCase()}">
                    <input type="checkbox" value="${m.id}" ${data.types.includes(m.id) ? 'checked' : ''} class="w-4 h-4 rounded border-gray-600 bg-gray-800 text-blue-500 focus:ring-blue-500 mime-checkbox">
                    <span class="text-sm text-gray-300">${m.label}</span>
                </label>
            `).join('');

            const selectedCount = data.types.length;
            const btnText = selectedCount > 0 ? `${selectedCount} format` : 'Pilih Format';

            const item = document.createElement('div');
            item.className = 'p-5 border border-gray-700 rounded-xl bg-gray-900/30 flex gap-6 items-start relative group transition-all hover:border-gray-600';
            
            item.innerHTML = `
                <div class="flex-1 grid grid-cols-1 md:grid-cols-12 gap-4">
                    <div class="md:col-span-4">
                        <label class="block text-xs font-medium text-gray-500 mb-1">Nama Dokumen</label>
                        <input type="text" placeholder="Misal: Ijazah Terakhir" value="${data.label}" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 focus:outline-none focus:border-blue-500">
                    </div>
                    
                    <div class="md:col-span-5 relative">
                        <label class="block text-xs font-medium text-gray-500 mb-1">Format Diizinkan (MIME Type)</label>
                        <div class="relative">
                            <button type="button" class="mime-toggle w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 flex justify-between items-center focus:outline-none focus:border-blue-500">
                                <span class="mime-btn-text">${btnText}</span>
                                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </button>
                            
                            <div class="mime-menu hidden absolute top-full left-0 w-full mt-1 bg-gray-800 border border-gray-700 rounded-lg shadow-xl z-50 overflow-hidden">
                                <div class="p-2 border-b border-gray-700">
                                    <input type="text" placeholder="Cari format..." class="mime-search w-full bg-gray-900 border border-gray-700 rounded px-2 py-1.5 text-xs text-gray-100 focus:outline-none focus:border-blue-500">
                                </div>
                                <div class="max-h-40 overflow-y-auto py-1 custom-scrollbar">
                                    ${mimeOptionsHtml}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="md:col-span-3">
                        <label class="block text-xs font-medium text-gray-500 mb-1">Maks Ukuran (KB)</label>
                        <input type="number" value="${data.maxKb}" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 focus:outline-none focus:border-blue-500">
                    </div>

                    <div class="md:col-span-12 mt-2">
                        <label class="block text-xs font-medium text-gray-500 mb-1">Deskripsi / Instruksi</label>
                        <textarea placeholder="Tambahkan penjelasan singkat tentang dokumen ini..." rows="2" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 focus:outline-none focus:border-blue-500 resize-y">${data.desc}</textarea>
                    </div>

                    <div class="md:col-span-12 flex items-center justify-between pt-1">
                        <label class="flex items-center gap-2 text-sm text-gray-300 cursor-pointer">
                            <input type="checkbox" ${data.req ? 'checked' : ''} class="w-4 h-4 rounded border-gray-600 bg-gray-700 text-blue-500 focus:ring-blue-500"> 
                            Wajib Diisi (Required)
                        </label>
                    </div>
                </div>
                <button type="button" class="text-red-500/50 hover:text-red-400 p-2 rounded-lg hover:bg-red-500/10" onclick="this.closest('.group').remove()">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
            `;
            
            // event listener untuk dropdown
            const toggleBtn = item.querySelector('.mime-toggle');
            const menu = item.querySelector('.mime-menu');
            const searchInput = item.querySelector('.mime-search');
            const mimeItems = item.querySelectorAll('.mime-item');
            const checkboxes = item.querySelectorAll('.mime-checkbox');
            const btnTextEl = item.querySelector('.mime-btn-text');

            toggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                // tutup menu lain
                document.querySelectorAll('.mime-menu').forEach(m => {
                    if (m !== menu) m.classList.add('hidden');
                });
                menu.classList.toggle('hidden');
                if(!menu.classList.contains('hidden')) searchInput.focus();
            });

            menu.addEventListener('click', (e) => e.stopPropagation());

            searchInput.addEventListener('input', (e) => {
                const val = e.target.value.toLowerCase();
                mimeItems.forEach(el => {
                    el.style.display = el.dataset.search.includes(val) ? 'flex' : 'none';
                });
            });

            checkboxes.forEach(cb => {
                cb.addEventListener('change', () => {
                    const count = Array.from(checkboxes).filter(c => c.checked).length;
                    btnTextEl.innerText = count > 0 ? `${count} format` : 'Pilih Format';
                });
            });

            docList.appendChild(item);
        }

        // tutup dropdown kalo klik di luar
        document.addEventListener('click', () => {
            document.querySelectorAll('.mime-menu').forEach(m => m.classList.add('hidden'));
        });

        defaultDocs.forEach(doc => createDocItem(doc));
        addDocBtn.addEventListener('click', () => createDocItem());
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }
    </style>
</body>
</html>
